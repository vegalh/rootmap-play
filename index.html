    <script>
      // Restores the real path after a GitHub Pages 404.html redirect.
      // See public/404.html for the matching encode step. This is the
      // well-known "spa-github-pages" technique, reimplemented minimally
      // so deep links (e.g. /pocket-universe) work on static hosting.
      (function () {
        var redirect = window.sessionStorage.redirect
        delete window.sessionStorage.redirect
        if (redirect && redirect !== window.location.href) {
          window.history.replaceState(null, '', redirect)
        }
      })()
    </script>
