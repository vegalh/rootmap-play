# Supabase CLI project configuration for local development.
#
# This file was hand-written (the Supabase CLI is not installed in this
# environment) to the commonly-stable shape of `supabase init` output. If
# `supabase start` reports this file is out of date for your installed CLI
# version, run `supabase init` in this directory and re-apply the
# `project_id` below plus anything you've customized — do not assume this
# file is guaranteed correct for every CLI version.

project_id = "rootmap-play"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"
